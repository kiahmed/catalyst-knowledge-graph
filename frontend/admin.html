<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/auth.css">
<title>Robotics data admin · Arboryx</title>
<style>
:root {
  --bg: #f3f1ed; --bg-card: #fdfcfa; --bg-detail: #f0ede7; --border: #ddd8cf; --border-focus: #0ea5e9;
  --text: #1c1917; --text-secondary: #57534e; --text-muted: #a8a29e; --accent: #0ea5e9;
  --warn: #d97706; --bad: #dc2626; --ok: #16a34a; --radius: 10px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border);
         background: var(--bg-card); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 15px; font-weight: 600; }
header .who { margin-left: auto; color: var(--text-secondary); font-size: 12px; }
button { font: inherit; border: 1px solid var(--border); background: var(--bg-card); border-radius: 7px; padding: 5px 10px;
         cursor: pointer; color: var(--text); }
button:hover:not(:disabled) { border-color: var(--border-focus); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.danger { color: var(--bad); }
button:disabled { opacity: .45; cursor: not-allowed; }
input, select { font: inherit; border: 1px solid var(--border); border-radius: 7px; padding: 5px 8px; background: #fff; }
.cols { display: grid; grid-template-columns: 260px 300px minmax(320px, 1fr) minmax(340px, 1.1fr); gap: 10px;
        padding: 10px; height: calc(100vh - 90px); }
.col { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); display: flex;
       flex-direction: column; min-height: 0; }
.col h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-secondary);
          padding: 10px 12px 6px; display: flex; gap: 6px; align-items: center; }
.col .tools { padding: 0 12px 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.list { overflow: auto; flex: 1; padding: 0 6px 8px; }
.item { padding: 7px 8px; border-radius: 7px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.item:hover { background: var(--bg-detail); }
.item.sel { background: #e0f2fe; }
.item .meta { margin-left: auto; color: var(--text-muted); font-size: 11px; white-space: nowrap; }
.tag { font-size: 10px; border-radius: 5px; padding: 1px 5px; border: 1px solid var(--border); color: var(--text-secondary); }
.tag.warn { color: var(--warn); border-color: var(--warn); }
.tag.bad { color: var(--bad); border-color: var(--bad); }
.tag.ok { color: var(--ok); border-color: var(--ok); }
.sec { padding: 4px 12px 10px; }
.sec h3 { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin: 8px 0 4px; }
.kv { color: var(--text-secondary); }
.mono { font-family: "IBM Plex Mono", monospace; font-size: 12px; }
.detail { overflow: auto; flex: 1; padding: 4px 12px 12px; }
.detail p { line-height: 1.5; margin: 6px 0; }
.form { display: grid; grid-template-columns: 90px 1fr; gap: 8px; align-items: center; margin: 10px 0; }
.frozen .col:not(.editing) { pointer-events: none; opacity: .55; }
#busy { display: none; position: fixed; inset: 0; z-index: 9999; cursor: wait; background: transparent; }
#banner { padding: 8px 16px; font-size: 12px; display: none; border-bottom: 1px solid var(--border); }
#banner.warn { display: block; background: #fef3c7; color: #92400e; }
#banner.bad { display: block; background: #fee2e2; color: #991b1b; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #1c1917; color: #fff;
         padding: 9px 14px; border-radius: 8px; display: none; max-width: 80vw; z-index: 20; }
#toast.err { background: var(--bad); }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; z-index: 10; }
.modal .box { background: var(--bg-card); border-radius: 12px; padding: 16px; width: min(900px, 94vw); max-height: 84vh; overflow: auto; }
.modal table { width: 100%; border-collapse: collapse; margin: 10px 0; }
.modal td, .modal th { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
.gate { padding: 40px; text-align: center; color: var(--text-secondary); }
.pill { border-radius: 999px; }
.pill.has { background: #b45309; color: #fff; border-color: #b45309; }
.tag.rev { background: #b45309; color: #fff; }
</style>
</head>
<body>
<header>
  <h1>Robotics data admin</h1>
  <button id="btnScan" title="Rule-based scan, no LLM, free">Scan suspects</button>
  <button id="btnLog">Edit log</button>
  <button id="btnRejected" title="Every rejected relationship across all entities — restore or delete permanently">Rejected</button>
  <button id="btnReview" class="pill" title="Items the system couldn't decide — a human (or an LLM pass) must">Review …</button>
  <span class="who" id="who">Signing in…</span>
</header>
<div id="banner"></div>
<div id="gate" class="gate" hidden></div>
<div class="cols" id="cols" hidden>
  <section class="col" id="colEntities">
    <h2>Entities</h2>
    <div class="tools"><input id="q" placeholder="Search name or alias" style="flex:1"><button id="btnNewEntity" title="Create entity">+</button></div>
    <div class="list" id="entityList"></div>
  </section>
  <section class="col" id="colEntity">
    <h2>Entity</h2>
    <div class="detail" id="entityPane"><p class="kv">Pick an entity.</p></div>
  </section>
  <section class="col" id="colRels">
    <h2>Relationships <span id="relCount" class="tag"></span></h2>
    <div class="tools">
      <input id="relFilter" placeholder="filter by card text…" title="Shows only relationships whose card headline/story/mechanism or endpoint contains this text" style="width:150px">
      <label title="Case-sensitive filter (e.g. 'Humanoid' the company vs 'humanoid robots')"><input type="checkbox" id="relCase"> Aa</label>
      <label title="Tick / untick every relationship shown"><input type="checkbox" id="tickAll"> all</label>
      <label><input type="checkbox" id="onlyUnnamed"> not named in card</label>
      <label title="Send the checked edges to the LLM, review its picks, then apply"><input type="checkbox" id="useLlm"> Fix with LLM</label>
      <button id="btnFix" disabled>Fix checked</button>
      <button id="btnRepointMany" disabled title="Move the checked relationships from this entity to another existing entity">Repoint checked →</button>
    </div>
    <div class="list" id="relList"></div>
  </section>
  <section class="col" id="colEdit">
    <h2>Relationship</h2>
    <div class="detail" id="relPane"><p class="kv">Pick a relationship.</p></div>
  </section>
</div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div id="busy" title="Working…"></div>
<div id="toast"></div>

<script src="/firebase-config.js"></script>
<script src="/admin-config.js"></script>
<script src="/assets/auth.js"></script>
<script>
(function () {
  'use strict';
  // The service's own URL (written by make deploy-frontend into the
  // gitignored /admin-config.js) — called directly, not via a Hosting rewrite.
  const API = window.ROBOTICS_ADMIN_API || '';
  const S = { user: null, me: null, entities: [], suspects: new Set(), entity: null, rel: null, checked: new Set() };
  const $ = id => document.getElementById(id);
  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (k === 'class') n.className = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v === true ? '' : v);
    });
    kids.flat().forEach(k => n.append(k instanceof Node ? k : document.createTextNode(k == null ? '' : String(k))));
    return n;
  };
  function toast(msg, err) {
    const t = $('toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
    clearTimeout(toast.h); toast.h = setTimeout(() => { t.style.display = 'none'; }, err ? 9000 : 4000);
  }
  // Busy cursor + click shield while a save runs and the columns reload.
  let busyN = 0;
  function busy(on) { busyN = Math.max(0, busyN + (on ? 1 : -1)); $('busy').style.display = busyN ? 'block' : 'none'; }
  let api = async function (path, body) {
    if (body) busy(true);
    try { return await apiCall(path, body); } finally { if (body) busy(false); }
  };
  async function apiCall(path, body) {
    const token = await S.user.getIdToken();
    const res = await fetch(API + path, {
      method: body ? 'POST' : 'GET',
      headers: Object.assign({ Authorization: 'Bearer ' + token }, body ? { 'Content-Type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({ ok: false, error: 'HTTP ' + res.status }));
    if (!res.ok || data.ok === false) { const e = new Error(data.error || ('HTTP ' + res.status)); e.status = res.status; e.data = data; throw e; }
    return data;
  }

  // ── Entities column ───────────────────────────────────────────
  let qTimer;
  async function loadEntities() {
    const data = await api('/entities?q=' + encodeURIComponent($('q').value.trim()));
    S.entities = data.entities; renderEntities();
  }
  function renderEntities() {
    const list = $('entityList'); list.replaceChildren();
    S.entities.forEach(e => list.append(el('div', {
      class: 'item' + (S.entity && S.entity.id === e.id ? ' sel' : ''), onclick: () => selectEntity(e.id) },
      el('span', {}, e.name), S.suspects.has(e.id) ? el('span', { class: 'tag warn', title: 'Scan: own name rarely in its cards' }, 'suspect') : '',
      el('span', { class: 'meta' }, `${e.cards} cards · ${e.aliases} al`))));
  }
  $('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(() => loadEntities().catch(e => toast(e.message, true)), 250); });

  // ── Entity column ─────────────────────────────────────────────
  async function selectEntity(id) {
    S.entity = await api('/entity/' + id); S.rel = null; S.checked.clear(); S.selA = new Set(); S.selC = new Set();
    renderEntities(); renderEntity(); renderRels(); renderRel();
  }
  // After any save/revert: reload every column (entity list counts included),
  // keeping the selected entity and relationship when they still exist.
  async function afterEdit(focusId) {
    S.chips = {};
    busy(true);
    try { await reloadAll(focusId); } finally { busy(false); }
  }
  async function reloadAll(focusId) {
    refreshStatus();   // review count may have changed (an edit settles its review items)
    const relId = S.rel && S.rel.rel_id, id = focusId || (S.entity && S.entity.id);
    await loadEntities();
    if (!id) return;
    try { await selectEntity(id); } catch (e) {
      // 400 "no entity N" = it's gone (merged / reverted create); anything else is a real failure.
      if (e.status !== 400) { renderRel(); toast('Saved, but reloading failed (' + e.message + ') — reload the page', true); return; }
      S.entity = null; S.rel = null; S.checked.clear(); renderEntity(); renderRels(); renderRel(); return;
    }
    const r = relId && S.entity.relationships.find(x => x.rel_id === relId);
    if (r) { S.rel = r; renderRels(); renderRel(); }
  }
  function renderEntity() {
    const e = S.entity, p = $('entityPane'); p.replaceChildren();
    if (!e) return;
    S.selA = S.selA || new Set(); S.selC = S.selC || new Set();
    p.append(el('p', {}, el('b', {}, e.name), ' ', el('span', { class: 'kv' }, `${e.type}${e.ticker ? ' · ' + e.ticker : ''} · id ${e.id}`)));
    (e.review || []).forEach(rv => { const [why, whyBox] = whyToggle(rv); p.append(el('div', { class: 'item' },
      el('span', { class: 'tag rev' }, 'review'), el('span', { class: 'kv', style: 'flex:1' }, rv.reason || rv.kind),
      why, el('button', { onclick: () => markReviewed([rv.id]) }, 'reviewed')), whyBox); });
    const bulk = el('div', { class: 'tools', style: 'padding:4px 0 8px' },
      el('button', { id: 'btnSpinOutMany', onclick: spinOutMany,
                     title: 'Each ticked alias becomes its own entity, taking the relationships that reached ' + e.name + ' only through it' }, 'Spin out aliases'),
      el('button', { id: 'btnSpinInMany', onclick: spinInMany, class: 'danger',
                     title: 'Each ticked child folds back into ' + e.name + ' as an alias (a merge — one-way)' }, 'Spin in children'),
      el('button', { onclick: editEntity, title: 'Rename or change type (old name stays as an alias)' }, 'Edit entity'),
      el('button', { onclick: addAlias, title: 'Add another name for this same organization' }, 'Add alias…'),
      el('button', { class: 'danger', onclick: deleteEntity, title: 'Delete this entity; if relationships point at it, they are deleted too (you confirm the list). Revertible.' }, 'Delete entity'));
    p.append(bulk);
    p.append(el('h3', {}, 'Aliases'));
    e.aliases.forEach(a => p.append(el('div', { class: 'item' },
      el('input', { type: 'checkbox', checked: S.selA.has(a.alias), title: 'Select for bulk spin-out',
                    onclick: ev => { ev.stopPropagation(); ev.target.checked ? S.selA.add(a.alias) : S.selA.delete(a.alias); syncSel2(); } }),
      el('span', { style: 'cursor:pointer', title: 'Tick the relationships that reached this entity only through this alias',
                   onclick: () => tickVia(a) }, a.alias),
      a.via_rel_ids && a.via_rel_ids.length ? el('span', { class: 'tag warn',
        title: `${a.via_rel_ids.length} relationship(s) on cards that never name ${e.name} — click the alias to tick them` },
        `only via: ${a.via_rel_ids.length}`) : '',
      a.bare_brand ? el('span', { class: 'tag warn', title: 'One brand word for a longer name — may mean the parent/sister' }, 'brand') : '',
      a.also_on.length ? el('span', { class: 'tag bad', title: 'Also an alias of: ' + a.also_on.join(', ') }, 'shared') : '',
      a.review ? el('span', { class: 'tag rev', title: a.review.reason || 'needs review' }, 'review') : '',
      a.review ? el('button', { title: 'Mark this alias reviewed', onclick: ev => { ev.stopPropagation(); markReviewed([a.review.id]); } }, 'reviewed') : '',
      el('span', { class: 'meta' },
        el('button', { title: 'Make this alias its own entity, taking the checked relationships with it', onclick: () => spinOut(a.alias) }, 'spin out'), ' ',
        el('button', { title: 'Move to another entity', onclick: () => moveAlias(a.alias) }, 'move'), ' ',
        el('button', { class: 'danger', title: 'Remove this alias', onclick: () => dropAlias(a.alias) }, 'drop')))));
    p.append(el('h3', {}, 'Family'));
    if (!e.family.length) p.append(el('p', { class: 'kv' }, 'none'));
    e.family.forEach(f => p.append(el('div', { class: 'item', onclick: () => selectEntity(f.id) },
      f.role === 'child' ? el('input', { type: 'checkbox', checked: S.selC.has(f.id), title: 'Select for bulk spin-in',
        onclick: ev => { ev.stopPropagation(); ev.target.checked ? S.selC.add(f.id) : S.selC.delete(f.id); syncSel2(); } }) : '',
      el('span', { class: 'tag' }, f.role), el('span', {}, f.name),
      el('span', { class: 'meta' }, el('button', { class: 'danger', onclick: ev => { ev.stopPropagation(); unlink(f); } }, 'unlink')))));
    p.append(el('div', { class: 'tools', style: 'padding:10px 0' },
      el('button', { onclick: () => linkTo('subsidiary_of') }, 'Set parent…'),
      el('button', { onclick: () => linkTo('sister_of') }, 'Add sister…'),
      el('button', { class: 'danger', onclick: mergeInto }, 'Merge into…')));
    // Internal events (self-loops kept by a merge, docs/ticket-internal-events.md): not graph edges, so not in
    // the Relationships column — listed here so a wrong one (e.g. from a duplicate-entity merge) can be fixed.
    const ie = e.internal_events || [];
    p.append(el('h3', {}, `Internal events (${ie.length})`));
    if (!ie.length) p.append(el('p', { class: 'kv' }, 'none'));
    ie.forEach(x => p.append(el('div', { class: 'item' },
      el('span', { style: 'flex:1' }, el('b', {}, `${e.name} —${x.rel_type}→ itself`), ' ',
         el('span', { class: 'kv' }, `rel ${x.rel_id} · ${x.date || ''} · ${(x.headline || '').slice(0, 80)}`),
         x.mechanism ? el('div', { class: 'kv' }, x.mechanism.slice(0, 200)) : ''),
      el('a', { href: '/#card-' + x.entry_id, target: '_blank', class: 'kv' }, x.entry_id),
      el('button', { title: 'Hide it (status rejected; revertible; restorable from the Rejected list)', onclick: async () => {
        if (!confirm(`Reject internal event "${e.name} ${x.rel_type}" on ${x.entry_id}?`)) return;
        if (await run('set_edge_status', { rel_id: x.rel_id, status: 'rejected', expect: { status: 'internal' } }, 'Rejected')) afterEdit();
      } }, 'Reject'),
      el('button', { class: 'danger', title: 'Remove it permanently (revertible from the Edit log)', onclick: async () => {
        if (!confirm(`Permanently delete internal event "${e.name} ${x.rel_type}" on ${x.entry_id}?`)) return;
        if (await run('delete_edge', { rel_id: x.rel_id, expect: { status: 'internal' } }, 'Deleted')) afterEdit();
      } }, 'Delete'))));
    syncSel2();
  }
  function syncSel2() {
    const a = S.selA ? S.selA.size : 0, c = S.selC ? S.selC.size : 0;
    const bo = $('btnSpinOutMany'), bi = $('btnSpinInMany');
    if (bo) { bo.disabled = !a; bo.textContent = a ? `Spin out ${a} alias${a > 1 ? 'es' : ''}` : 'Spin out aliases'; }
    if (bi) { bi.disabled = !c; bi.textContent = c ? `Spin in ${c} child${c > 1 ? 'ren' : ''}` : 'Spin in children'; }
  }
  function pickType(label, dflt) {
    const types = (S.me && S.me.entity_types) || ['public_company', 'private_company', 'government', 'organization', 'group'];
    const t = prompt(`${label}\nType — one of: ${types.join(', ')}`, dflt); if (!t) return null;
    if (!types.includes(t.trim())) { toast(`Unknown type "${t}"`, true); return null; }
    return t.trim();
  }
  async function spinOutMany() {
    const e = S.entity, aliases = e.aliases.filter(a => S.selA.has(a.alias));
    if (!aliases.length) return;
    const type = pickType(`Spin out ${aliases.length} alias(es) of ${e.name} as their own entities.`, 'private_company'); if (!type) return;
    const parent = prompt(`Make ${e.name} their parent (they become its children)? y / n`, 'y'); if (parent === null) return;
    const makeParent = /^y/i.test(parent.trim());
    const list = aliases.map(a => `  ${a.alias}  (takes ${(a.via_rel_ids || []).length} relationship(s))`).join('\n');
    if (!confirm(`Create ${aliases.length} entit${aliases.length > 1 ? 'ies' : 'y'} [${type}]${makeParent ? ', children of ' + e.name : ''}:\n${list}\n\nEach takes the relationships that reached ${e.name} only through its alias (re-checked at save). All or nothing; each one is revertible.`)) return;
    const d = await run('spin_out_many', { from_entity_id: e.id, aliases: aliases.map(a => a.alias), type, make_parent: makeParent },
                        `Spun out ${aliases.length}`);
    if (d) afterEdit();
  }
  async function spinInMany() {
    const e = S.entity, kids = e.family.filter(f => f.role === 'child' && S.selC.has(f.id));
    if (!kids.length) return;
    if (!confirm(`Fold ${kids.length} child entit${kids.length > 1 ? 'ies' : 'y'} back into ${e.name}?\n${kids.map(k => '  ' + k.name).join('\n')}\n\nEach name becomes an alias of ${e.name} and its relationships move to ${e.name}. This is a merge: it can NOT be reverted from the log.`)) return;
    const d = await run('spin_in_many', { into_entity_id: e.id, child_ids: kids.map(k => k.id) }, `Spun in ${kids.length}`);
    if (d) afterEdit();
  }
  async function editEntity() {
    const e = S.entity;
    const name = prompt(`Rename ${e.name} (the old name stays as an alias):`, e.name); if (name === null) return;
    const type = pickType(`Type for "${name.trim() || e.name}"`, e.type); if (!type) return;
    if (name.trim() === e.name && type === e.type) return toast('Nothing changed');
    const d = await run('edit_entity', { entity_id: e.id, name: name.trim() || e.name, type, expect: { name: e.name, type: e.type } }, 'Entity');
    if (d) afterEdit();
  }
  async function addAlias() {
    const e = S.entity;
    const alias = prompt(`New alias for ${e.name} (another name for the SAME organization, e.g. a product brand):`);
    if (!alias || !alias.trim()) return;
    const d = await run('add_alias', { entity_id: e.id, alias: alias.trim() }, 'Alias');
    if (d) afterEdit();
  }
  async function deleteEntity() {
    const e = S.entity;
    const edges = e.relationships || [];
    const goes = [e.aliases.length ? 'aliases: ' + e.aliases.map(a => a.alias).join(', ') : '',
                  e.family.length ? 'family links: ' + e.family.map(f => `${f.role} ${f.name}`).join(', ') : ''].filter(Boolean);
    const list = edges.slice(0, 15).map(r => `  ${r.a.name} —${r.rel_type}→ ${r.b.name} [${r.status}]`).join('\n');
    const msg = edges.length
      ? `"${e.name}" still has ${edges.length} relationship(s). Delete it AND all of them?\n${list}` +
        (edges.length > 15 ? `\n  … and ${edges.length - 15} more` : '') +
        `\n\nUse this only for entities that aren't real organizations.`
      : `Delete "${e.name}"?`;
    const full = msg + (goes.length ? '\nAlso removed:\n  ' + goes.join('\n  ') : '') + '\nRevertible from the Edit log.';
    // always the with-edges path: it also removes rows the editor doesn't list (self-loops); the count guards a stale screen
    const payload = { entity_id: e.id, expect_name: e.name, with_edges: true, expect_edges: edges.length };
    const live = edges.filter(r => r.status === 'active' || r.status === 'materialized').length;
    if (live) {
      // Live edges = real data on the site: a click is not enough, type the name (the server checks it too).
      const typed = prompt(full + `\n\n${live} of these are ACTIVE (on the site now).\nType the entity name exactly to delete it:`);
      if (typed === null) return;
      if (typed.trim() !== e.name) { alert(`"${typed.trim()}" doesn't match "${e.name}" — nothing was deleted.`); return; }
      payload.confirm_name = typed.trim();
    } else if (!confirm(full)) return;
    const d = await run('delete_entity', payload, 'Delete');
    if (d) afterEdit();
  }

  // ── Relationships column ──────────────────────────────────────
  function visibleRels() {
    const q = $('relFilter').value.trim(), cs = $('relCase').checked;
    const has = t => cs ? t.includes(q) : t.toLowerCase().includes(q.toLowerCase());
    return (S.entity ? S.entity.relationships : []).filter(r => (!$('onlyUnnamed').checked || !r.named_in_card)
      && (!q || has(`${r.headline || ''} ${r.finding || ''} ${r.mechanism || ''} ${r.a.name} ${r.b.name}`)));
  }

  // ── Relationship editor column ────────────────────────────────

        el('button', { class: 'danger', title: 'Remove this relationship permanently (hard delete; revertible from the Edit log)',

            const d = await run('delete_edge', { rel_id: r.rel_id, expect: { status: r.status } }, 'Deleted');

          onclick: async () => {

    const statSel = el('select', {}, S.me.statuses.map(t => el('option', { value: t, selected: t === r.status }, t)));
    p.append(el('div', { class: 'form' }, 'Source', el('div', {}, aIn, aDl), 'Type', typeSel, 'Target', el('div', {}, bIn, bDl), 'Status', statSel));
    p.append(el('div', { class: 'tools', style: 'padding:0' },
      el('button', { class: 'primary', onclick: async ev => {

          if (b !== r.b.id) { set.entity_b_id = b; expect.entity_b_id = r.b.id; }

          toast(done.length ? `Saved (${done.map(d => d.edit_id).join(', ')}) — cards & graph refreshed` : 'Nothing changed');

  // Entity input with live suggestions; data-id holds the picked entity's id ('' until one matches exactly).
  function entityPick(label, ent) {
    const inp = el('input', { list: 'dl_' + label, value: ent ? ent.name : '', 'data-id': ent ? ent.id : '', style: 'width:100%' });
    const dl = el('datalist', { id: 'dl_' + label });
    let t; inp.addEventListener('input', () => { clearTimeout(t); t = setTimeout(async () => {
      const d = await api('/entities?limit=25&q=' + encodeURIComponent(inp.value.trim()));
      dl.replaceChildren(...d.entities.map(e => el('option', { value: e.name, 'data-id': e.id }, `${e.cards} cards`)));
      const hit = d.entities.find(e => e.name === inp.value); inp.dataset.id = hit ? hit.id : '';
    }, 200); });
    return [inp, dl];

  // Pick-list chips: entities on this card's edges (+ "new" = created from it)

  // ── Entity / alias actions ────────────────────────────────────
  async function choose(title) {   // pick an entity by exact name
    const name = prompt(title + '\n(exact entity name)'); if (!name) return null;
    const d = await api('/entities?limit=50&q=' + encodeURIComponent(name.trim()));
    const hit = d.entities.find(e => e.name.toLowerCase() === name.trim().toLowerCase());

  }
  async function run(op, payload, note) {
    try { const d = await api('/edit', { op, payload }); toast(`${note || op} saved (${d.edit_id})`); return d; }
    catch (e) { toast(e.message, true); return null; }
  }
  async function moveAlias(alias) {
    const to = await choose(`Move alias "${alias}" from ${S.entity.name} to:`); if (!to) return;

  }

    const type = pickType(`Type for "${name}"`, 'private_company'); if (!type) return;

      el('div', { class: 'tools', style: 'padding:0' },

  // ── Scan + edit log ───────────────────────────────────────────
  $('btnScan').addEventListener('click', async () => {
    try {
      const d = await api('/scan');

      const box = $('modalBox'); box.replaceChildren(
        el('h3', {}, `Suspect entities (${d.suspect_entities.length}) — own name rarely in their cards`),
        el('table', {}, d.suspect_entities.map(s => el('tr', { style: 'cursor:pointer', onclick: () => { $('modal').style.display = 'none'; selectEntity(s.id); } },
          el('td', {}, s.name), el('td', {}, `${s.named_in}/${s.cards} cards name it`)))),

  // ── Review queue ──────────────────────────────────────────────
  const REVIEW_KIND = {
    entity_ingest_unsure: 'Entity matching (ingest was unsure)', direction_unclear: 'Relationship direction unclear',
    entity_merge: 'Entity audit: merge', entity_subsidiary_of: 'Entity audit: parent link', entity_sister_of: 'Entity audit: sister link',
    entity_wrong_alias: 'Entity audit: alias',
    dedup_matched_missing: 'Arboryx dedup', upstream_deleted_unexpected: 'Arboryx: finding deleted unexpectedly',
  };
  // The decision trail recorded when the item was flagged (older items: the reason only).
  function trail(item) {
    const steps = (item.path && item.path.length) ? item.path : [item.reason || 'No trail recorded (flagged before 2026-11-10).'];
    return el('ol', { class: 'kv', style: 'margin:4px 0 6px 18px;padding:0' }, ...steps.map(s => el('li', {}, String(s).replace(/^\d+\.\s*/, ''))));
  }
  function whyToggle(item) {
    const box = el('div', { style: 'display:none' }, trail(item));

      box.style.display = box.style.display === 'none' ? 'block' : 'none'; } }, 'why?');

  function setReviewCount(n) {
    const b = $('btnReview'); if (n === null || n === undefined) { b.textContent = 'Review ?'; return; }
    b.textContent = `Review ${n}`; b.classList.toggle('has', n > 0);

  async function markReviewed(ids, resolution) {
    if (!ids.length) return;
    try {
      const d = await api('/review/resolve', { ids, resolution: resolution || 'reviewed in admin' });

  $('btnReview').addEventListener('click', async () => {
    let d; try { d = await api('/review'); } catch (e) { return toast(e.message, true); }
    setReviewCount(d.count);
    const box = $('modalBox'); box.replaceChildren(el('h3', {}, `Needs review (${d.count})`));
    if (!d.items.length) box.append(el('p', { class: 'kv' }, 'Nothing to review.'));
    const groups = {};
    d.items.forEach(i => (groups[i.kind] = groups[i.kind] || []).push(i));
    Object.entries(groups).forEach(([kind, items]) => {
      const picked = new Set();
      const btn = el('button', { class: 'primary', disabled: true }, 'Mark reviewed');
      const sync = () => { btn.disabled = !picked.size; btn.textContent = picked.size ? `Mark ${picked.size} reviewed` : 'Mark reviewed'; };
      const all = el('input', { type: 'checkbox', title: 'Select all in this category', onclick: ev => {
        items.forEach(i => ev.target.checked ? picked.add(i.id) : picked.delete(i.id));
        box.querySelectorAll(`input[data-kind="${kind}"]`).forEach(c => { c.checked = ev.target.checked; }); sync(); } });
      btn.addEventListener('click', async () => { $('modal').style.display = 'none'; await markReviewed([...picked]); });
      box.append(el('h3', {}, all, ' ', `${REVIEW_KIND[kind] || kind} (${items.length})`, ' ', btn));
      items.forEach(i => {
        const subject = i.edge || i.entity || String(i.doc_id || '').split('~')[0];
        const openName = i.open_entity;
        const [why, whyBox] = whyToggle(i);

          el('input', { type: 'checkbox', 'data-kind': kind, onclick: ev => { ev.target.checked ? picked.add(i.id) : picked.delete(i.id); sync(); } }),
          el('span', { style: 'flex:1' }, el('b', {}, subject + (i.other ? ' · ' + i.other : '')), ' ',
             el('span', { class: 'kv' }, (i.reason || '').slice(0, 220))),
          i.entry_id ? el('a', { href: '/#card-' + i.entry_id, target: '_blank', class: 'kv' }, i.entry_id) : '',
          openName ? el('button', { title: 'Open in the editor', onclick: async () => {
            $('modal').style.display = 'none';
            try {   // by id (fresh from the server), then the exact relationship if this item is about one
              let id = i.open_entity_id;
              if (!id) {
                const r = await api('/entities?limit=200&q=' + encodeURIComponent(openName));
                const hit = r.entities.find(x => x.name.toLowerCase() === openName.toLowerCase());
                if (!hit) return toast(`Entity "${openName}" not found`, true);
                id = hit.id;
              }
              await selectEntity(id);
              $('q').value = S.entity.name; await loadEntities(); renderEntities();
              if (i.rel_id != null) {
                const r = S.entity.relationships.find(x => x.rel_id === Number(i.rel_id));
                if (r) { $('relFilter').value = ''; $('onlyUnnamed').checked = false; S.rel = r; renderRels(); renderRel(); }
                else toast('That relationship is no longer on this entity — it was changed; mark the item reviewed if done', true);
              }
            } catch (e) { toast(e.message, true); }
          } }, 'open') : '', why), whyBox);
      });
    });
    $('modal').style.display = 'flex';
  });

  // ── Rejected list (docs/ticket-admin-rejected-list-delete-guard.md) ──
  $('btnRejected').addEventListener('click', openRejected);
  async function openRejected() {
    let d; try { d = await api('/rejected'); } catch (e) { return toast(e.message, true); }
    const picked = new Set();
    const box = $('modalBox');
    const restore = el('button', { class: 'primary', disabled: true }, 'Restore');
    const purge = el('button', { class: 'danger', disabled: true }, 'Delete permanently');
    const sync = () => {
      restore.disabled = purge.disabled = !picked.size;
      restore.textContent = picked.size ? `Restore ${picked.size}` : 'Restore';
      purge.textContent = picked.size ? `Delete ${picked.size} permanently` : 'Delete permanently';
    };
    const all = el('input', { type: 'checkbox', title: 'Select all', onclick: ev => {
      d.edges.forEach(r => ev.target.checked ? picked.add(r.rel_id) : picked.delete(r.rel_id));
      box.querySelectorAll('input[data-rej]').forEach(c => { c.checked = ev.target.checked; }); sync(); } });
    const save = async (op, what) => {
      const ids = [...picked];
      const stuck = d.edges.filter(r => picked.has(r.rel_id) && r.self_loop && !r.restorable);
      if (op === 'restore_many' && stuck.length)
        return toast(`${stuck.length} selected row(s) are two-party self-loops (e.g. "X partners_with X"): they can't be restored — untick them or delete them`, true);
      const loops = d.edges.filter(r => picked.has(r.rel_id) && r.self_loop).length;
      const note = op === 'restore_many' && loops ? `\n${loops} of them are self-loops: they come back as internal events (not graph edges).` : '';
      if (!confirm(`${what} ${ids.length} rejected relationship(s)?${note}\nEach is one Edit-log row (revertible).`)) return;
      $('modal').style.display = 'none';
      if (await run(op, { rel_ids: ids }, what)) afterEdit();
    };
    restore.addEventListener('click', () => save('restore_many', 'Restore'));
    purge.addEventListener('click', () => save('delete_edge_many', 'Delete permanently'));
    box.replaceChildren(el('h3', {}, all, ' ', `Rejected relationships (${d.total ?? d.edges.length})`, ' ', restore, ' ', purge));
    if (d.total > d.edges.length) box.append(el('p', { class: 'kv' }, `Showing the newest ${d.edges.length} of ${d.total}.`));
    if (!d.edges.length) box.append(el('p', { class: 'kv' }, 'No rejected relationships.'));
    d.edges.forEach(r => box.append(el('div', { class: 'item' },
      el('input', { type: 'checkbox', 'data-rej': '1', onclick: ev => { ev.target.checked ? picked.add(r.rel_id) : picked.delete(r.rel_id); sync(); } }),
      el('span', { style: 'flex:1' },
         el('b', {}, `${r.a} —${r.rel_type}→ ${r.b}`), ' ',
         r.self_loop ? (r.restorable
           ? el('span', { class: 'tag', title: 'Same entity both ends: restores as an internal event' }, 'internal event')
           : el('span', { class: 'tag warn', title: 'A two-party type on one entity: noise — delete only' }, 'self-loop · delete only')) : '',
         ' ', el('span', { class: 'kv' }, `rel ${r.rel_id} · ${r.date || ''} · ${(r.headline || '').slice(0, 90)}`),
         r.mechanism ? el('div', { class: 'kv' }, r.mechanism.slice(0, 220)) : ''),
      el('a', { href: '/#card-' + r.entry_id, target: '_blank', class: 'kv' }, r.entry_id))));
    box.append(el('button', { onclick: () => { $('modal').style.display = 'none'; } }, 'Close'));
    $('modal').style.display = 'flex';
  }

  $('btnLog').addEventListener('click', async () => {
    try {
      const d = await api('/edits');
      const box = $('modalBox'); box.replaceChildren(el('h3', {}, 'Edit log (newest first)'),
        el('table', {}, d.edits.map(e => el('tr', {},
          el('td', { class: 'mono' }, e.edit_id), el('td', {}, e.edited_at), el('td', {}, e.op), el('td', { class: 'kv' }, e.email),
          el('td', { class: 'mono' }, JSON.stringify(e.before) + ' → ' + JSON.stringify(e.after)),
          el('td', {}, e.reverted_by ? el('span', { class: 'tag' }, 'reverted') : (e.revertible
            ? el('button', { onclick: async ev => { if (!confirm('Revert ' + e.edit_id + '?')) return; ev.target.disabled = true;
                try { await api('/revert', { edit_id: e.edit_id }); toast('Reverted ' + e.edit_id); $('modal').style.display = 'none';
                      afterEdit(); } catch (x) { toast(x.message, true); ev.target.disabled = false; } } }, 'Revert')
            : el('span', { class: 'tag' }, 'not revertible')))))),
        el('button', { onclick: () => { $('modal').style.display = 'none'; } }, 'Close'));
      $('modal').style.display = 'flex';
    } catch (e) { toast(e.message, true); }
  });

  // ── Backend activity banner (polled) ──────────────────────────
  // Edits are always safe (the server refuses to overwrite a newer DB), but
  // editing while an ingest/sweep runs means that run may start from stale
  // data — so say so, and ask before saving.
  S.status = { running: [], soon: [] };
  async function refreshStatus() {
    try { S.status = await api('/status'); } catch (e) { S.status = { running: [], soon: [], errors: [e.message] }; }
    setReviewCount(S.status.review_open);
    $('btnRejected').textContent = S.status.rejected == null ? 'Rejected' : `Rejected (${S.status.rejected})`;
    const b = $('banner'), r = S.status.running || [], soon = S.status.soon || [];
    if (r.length) {
      b.className = 'bad';
      b.textContent = '⛔ Running now: ' + r.map(x => `${x.what} (started ${x.minutes_since_start} min ago${x.precise ? '' : ', may be done'})`).join(' · ') +
        ' — we recommend waiting until it finishes before editing, so data stays in sync.';
    } else if (soon.length) {
      b.className = 'warn';
      b.textContent = '⚠ Coming up: ' + soon.map(x => `${x.job} in ${x.minutes_until} min`).join(' · ') +
        ' — finish edits before then, or come back after it completes.';
    } else { b.className = ''; b.textContent = ''; }
    if ((S.status.errors || []).length) console.warn('status:', S.status.errors);
  }
  const _origApi = api;
  api = async function (path, body) {   // confirm writes while something is running
    if (body && (path === '/edit' || path === '/revert') && (S.status.running || []).length &&
        !confirm('A backend run is in progress (' + S.status.running.map(x => x.what).join(', ') +
                 '). We recommend waiting until it finishes. Save anyway? (It will be logged.)')) {
      throw new Error('Cancelled — backend run in progress');
    }
    const out = await _origApi(path, body);
    if (out && out.warning) toast(out.warning, true);
    return out;
  };

  // ── Boot: sign in, then check admin access ────────────────────
  RoboticsAuth.requireSignIn(window.FIREBASE_CONFIG, async user => {
    S.user = user;
    if (!API) { $('gate').hidden = false; $('gate').textContent = 'Admin API not configured (admin-config.js) — run make deploy-frontend.'; return; }
    try {
      S.me = await api('/me');
      $('who').textContent = `${S.me.email} · ${S.me.ip}`;
      $('cols').hidden = false;
      await loadEntities();
      refreshStatus(); setInterval(refreshStatus, 60000);
    } catch (e) {
      $('gate').hidden = false;
      $('gate').textContent = e.status === 403 ? `Not authorized: ${e.message}` : `Admin service unavailable: ${e.message}`;
      $('who').textContent = user.email || '';
    }
  });
})();
</script>
</body>
</html>
