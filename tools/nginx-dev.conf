# nginx config for local frontend-dev container.
# Serves frontend/ as the root, with two mounts rewritten from the volume:
#   /cards.json         → /data/exports/cards.json
#   /card_images/*.png  → /data/exports/card_images/*.png
#
# This mirrors the prod cache/path layout from tools/frontend-deploy/firebase.json
# so the same frontend code works locally and in Firebase Hosting.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # cards.json — served from the shared data volume, short TTL
    location = /cards.json {
        alias /data/exports/cards.json;
        add_header Cache-Control "public, max-age=60, must-revalidate";
        try_files $uri =404;
    }

    # card images — served from shared volume, long TTL
    location /card_images/ {
        alias /data/exports/card_images/;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA fallback — unknown paths → index.html (router reads URL hash)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
